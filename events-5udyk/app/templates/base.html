<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏟️</text></svg>">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% if logged_in %}
  <header class="top">
    <a class="brand" href="/">
      <span class="mark">S</span>
      <span>
        <strong>Sudyk</strong>
        <em>Spectator Scheduler</em>
      </span>
    </a>
    <nav>
      <a href="/" id="nav-board" class="{% if request.url.path == '/' %}on{% endif %}">Board</a>
      <a href="/#upload" id="nav-add" class="{% if request.url.path.startswith('/add') %}on{% endif %}">Add</a>
    </nav>
  </header>
  {% endif %}
  <main class="{% block mainclass %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% if logged_in %}
  <footer class="foot"><a href="/logout">Log out</a></footer>
  {% endif %}
</body>
</html>
